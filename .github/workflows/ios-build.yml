name: iOS 15 Build

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      run_ios15_simulator_tests:
        description: "Run iOS 15 Simulator UI tests when an iOS 15 runtime is installed"
        required: false
        type: boolean
        default: true
      commit_ipa_to_repository:
        description: "Commit the latest unsigned IPA to artifacts/ on the selected branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build iOS 15 baseline IPA
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Report Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS

      - name: Build for generic iOS device
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify deployment baseline and package IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/KumoneIOS.app"
          test -d "$APP"

          MINIMUM_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          test "$MINIMUM_OS" = "15.0"

          ARTIFACT_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$ARTIFACT_DIR/Payload"
          ditto "$APP" "$ARTIFACT_DIR/Payload/KumoneIOS.app"
          (cd "$ARTIFACT_DIR" && ditto -c -k --sequesterRsrc --keepParent Payload KumoneIOS-iOS15-unsigned.ipa)

          unzip -l "$ARTIFACT_DIR/KumoneIOS-iOS15-unsigned.ipa" | grep -q 'Payload/KumoneIOS.app/Info.plist'
          cp "$RUNNER_TEMP/xcodebuild.log" "$ARTIFACT_DIR/xcodebuild.log"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Commit latest unsigned IPA to repository branch
        if: github.event_name == 'workflow_dispatch' && inputs.commit_ipa_to_repository
        env:
          ARTIFACT_DIR: ${{ steps.package.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          DESTINATION="artifacts/KumoneIOS-iOS15-latest.ipa"
          mkdir -p "$(dirname "$DESTINATION")"
          cp "$ARTIFACT_DIR/KumoneIOS-iOS15-unsigned.ipa" "$DESTINATION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DESTINATION"
          if git diff --cached --quiet; then
            echo "IPA content is unchanged; no repository commit is needed."
          else
            git commit -m "build(ios15): update latest unsigned IPA [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload unsigned IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: KumoneIOS-iOS15-unsigned-${{ github.run_number }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14

  test-ios15-simulator:
    name: Run iOS 15 simulator UI tests
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Report installed Simulator runtimes
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simctl-runtimes.log"
          xcrun simctl list devicetypes | tee "$RUNNER_TEMP/simctl-devicetypes.log"

      - name: Create and boot Simulator
        id: simulator
        run: |
          set -euo pipefail
          IOS15_RUNTIME="$(xcrun simctl list runtimes | awk -F ' - ' '/^iOS 15\./ { print $2; exit }')"
          if [ -n "$IOS15_RUNTIME" ]; then
            RUNTIME_ID="$IOS15_RUNTIME"
            RUNTIME_LABEL="iOS 15"
          else
            # GitHub-hosted macos-26 images currently omit the iOS 15 runtime.
            # Retain the compile-time iOS 15 gate and run the UI suite on the
            # newest installed iOS runtime instead, recording the distinction.
            RUNTIME_LINE="$(xcrun simctl list runtimes | awk '/^iOS [0-9]+\./ { line = $0 } END { print line }')"
            RUNTIME_ID="${RUNTIME_LINE##* - }"
            RUNTIME_LABEL="${RUNTIME_LINE%% (*} (fallback; iOS 15 runtime unavailable)"
          fi
          if [ -z "$RUNTIME_ID" ]; then
            echo "No available iOS Simulator runtime is installed on this hosted runner." >&2
            exit 1
          fi
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-13"
          UDID="$(xcrun simctl create "Kumone CI" "$DEVICE_TYPE" "$RUNTIME_ID")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime_label=$RUNTIME_LABEL" >> "$GITHUB_OUTPUT"
          echo "Selected Simulator runtime: $RUNTIME_LABEL"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run UI tests on selected Simulator
        if: steps.simulator.outcome == 'success'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ios15-test"
          xcodebuild test \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/ios15-test/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ios15-test/KumoneIOS-iOS15.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee "$RUNNER_TEMP/ios15-test/xcodebuild-test.log"

      - name: Upload iOS 15 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KumoneIOS-iOS15-test-evidence-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/simctl-runtimes.log
            ${{ runner.temp }}/simctl-devicetypes.log
            ${{ runner.temp }}/ios15-test
          if-no-files-found: warn
          retention-days: 14
